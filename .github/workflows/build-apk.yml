name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EduBridge Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/EduBridge-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduBridge-Android-App
          path: dist-apk/EduBridge-v1.0.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "EduBridge Android App v1.0.0"
          body: |
            ### 📱 EduBridge Android Application (v1.0.0)
            
            Download the official **EduBridge APK** for Android:
            - **Package**: `com.edubridge.app`
            - **Platform**: Android 7.0+ (API 24+) to Android 14+ (API 34)
            - **Features**: Liquid morphism interface, 120 FPS GPU acceleration, universal student login, interactive practice & timed exams.
            
            #### 📥 Direct Installation:
            1. Download `EduBridge-v1.0.apk` directly on your Android device.
            2. Tap the downloaded file to install.
            3. Enjoy seamless learning!
          files: dist-apk/EduBridge-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
