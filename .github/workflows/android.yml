name: Android Release Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EduBridge Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/app-release.apk ../dist-apk/EduBridge-v1.0.1.apk

      - name: Verify APK Exists
        run: |
          ls -la dist-apk/EduBridge-v1.0.1.apk
          test -f dist-apk/EduBridge-v1.0.1.apk || exit 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduBridge-v1.0.1-APK
          path: dist-apk/EduBridge-v1.0.1.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          name: "EduBridge Android v1.0.1"
          body: |
            ### 📱 EduBridge Android Application (v1.0.1)

            Official release of **EduBridge** for Android:
            - **Package**: `com.edubridge.app`
            - **Version**: `1.0.1` (Build 2)
            - **Target SDK**: Android 14 (API 34), Min SDK Android 7.0 (API 24)
            - **Architecture**: Universal APK
            - **Security**: Production HTTPS, strict SSL certificate verification, persistent authenticated sessions

            #### 📥 Direct Installation:
            1. Download `EduBridge-v1.0.1.apk` below directly on your Android phone.
            2. Tap the file to install.
            3. Enjoy CBSE Class 10 lessons, practice quizzes, and interactive learning!
          files: dist-apk/EduBridge-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
